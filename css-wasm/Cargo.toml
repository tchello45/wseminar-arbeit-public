[package]
name = "css-wasm"
version = "0.1.0"
edition = "2024"
description = "Discrete LoRa-CSS symbol simulation for the W-Seminar companion website"
authors = ["Tilman Kurmayer"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
